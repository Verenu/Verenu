<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Windows variant of icon-source.svg: the paper tile fills the whole canvas
       (no inset) so the taskbar/exe icon renders at full size next to
       neighboring apps. macOS keeps the inset tile in icon-source.svg.
       Regenerate src-tauri/icons with `powershell scripts/generate-icons.ps1`. -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#f9f7f3"/>

  <!-- What is locked to the tray icon is the bar HEIGHT RATIOS
       (0.336 / 0.672 / 1 / 0.578 / 0.297) - that ratio set is what makes this
       read as the same logo. Bar width, gap and overall scale are NOT locked,
       and deliberately differ from the tray.

       The tray sits on a dark tile that blends into the shell, so its glyph
       can be small and wide. This cream tile reads as a hard edge, and a
       tray-proportioned glyph looked like a small mark stranded on a white
       card. Copying the tray and merely scaling it up does not fix that: the
       tray silhouette is 1.31:1, so the short outer bars hit the tile's side
       margins long before the tall middle bar fills the height.

       So the gaps are tightened (bar 56, gap 22 vs the tray's 48/32) and the
       glyph is grown vertically instead: tallest bar 357 units, baseline 421,
       giving a near-square 71.9% x 69.7% glyph.

       cy sits at 47.3%, not 50%. The bars share a baseline, so their visual
       mass is bottom-heavy and true bounding-box centring reads as low.

       Do not hand-edit individual bars; change bar width, gap or the tallest
       height and re-derive all five from the ratios, keeping one shared
       baseline. Regenerate after any change. -->
  <rect x="72" y="301" width="56" height="120" rx="28" fill="#d97757"/>
  <rect x="150" y="181" width="56" height="240" rx="28" fill="#d97757"/>
  <rect x="228" y="64" width="56" height="357" rx="28" fill="#d97757"/>
  <rect x="306" y="215" width="56" height="206" rx="28" fill="#d97757"/>
  <rect x="384" y="315" width="56" height="106" rx="28" fill="#d97757"/>
</svg>
