<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- inset paper tile so macOS Dock optics don't make the icon feel oversized -->
  <rect x="64" y="64" width="384" height="384" rx="76" fill="#f9f7f3"/>

  <!-- 5 bars optically centered inside the inset paper tile -->
  <!-- bar width: 38px, gap: 16px, total: 5×38 + 4×16 = 254px -->
  <!-- x-start: (512 - 254) / 2 = 129 -->
  <!-- baseline y: 360, max height: 208px -->
  <rect x="129" y="290" width="38" height="70"  rx="19" fill="#d97757"/>
  <rect x="183" y="220" width="38" height="140" rx="19" fill="#d97757"/>
  <rect x="237" y="152" width="38" height="208" rx="19" fill="#d97757"/>
  <rect x="291" y="240" width="38" height="120" rx="19" fill="#d97757"/>
  <rect x="345" y="298" width="38" height="62"  rx="19" fill="#d97757"/>
</svg>
