<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- warm paper background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#f9f7f3"/>

  <!-- 5 bars bottom-aligned, centered in 512×512 -->
  <!-- bar width: 56px, gap: 20px, total: 5×56 + 4×20 = 360px -->
  <!-- x-start: (512 - 360) / 2 = 76 -->
  <!-- baseline y: 400, max height: 280px -->
  <!-- heights: 35%=98  70%=196  100%=280  55%=154  25%=70 -->
  <rect x="76"  y="302" width="56" height="98"  rx="28" fill="#d97757"/>
  <rect x="152" y="204" width="56" height="196" rx="28" fill="#d97757"/>
  <rect x="228" y="120" width="56" height="280" rx="28" fill="#d97757"/>
  <rect x="304" y="246" width="56" height="154" rx="28" fill="#d97757"/>
  <rect x="380" y="330" width="56" height="70"  rx="28" fill="#d97757"/>
</svg>
