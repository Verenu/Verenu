[package]
name = "verenu"
version = "0.17.0-nightly.20260905"
description = "Verenu — local-first AI dictation"
authors = ["Verenu Team"]
edition = "2021"

[[bin]]
name = "verenu"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "macos-private-api"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell       = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls", "charset"] }
# LAN device sync: mDNS discovery (pure Rust, no system daemon) + a TLS
# transport with self-signed per-device certificates. rustls uses the ring
# provider so Windows builds don't need aws-lc-rs's NASM/CMake toolchain.
mdns-sd          = "0.21"
if-addrs         = "0.15"
rustls           = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen            = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
spake2           = "0.4"
hkdf             = "0.12"
chacha20poly1305 = "0.10"
rand             = "0.8"
uuid             = { version = "1", features = ["v4"] }
bytes       = "1"
cpal        = "0.15"
rodio       = { version = "0.20", default-features = false }
hound       = "3.5"
nnnoiseless = "0.4"
base64      = "0.22"
anyhow      = "1"
log         = "0.4"
chrono      = { version = "0.4", features = ["serde"] }
crossbeam-queue = "0.3"
flate2      = "1"
sha2        = "0.10"
tar         = "0.4"
zip         = { version = "2", default-features = false, features = ["deflate"] }
# "vad-silero" pulls in transcribe-rs's own bundled Silero VAD wrapper
# (transcribe_rs::vad::SileroVad) on top of the ort/onnxruntime dependency
# "onnx" already requires — no separate ort dependency or hand-rolled ONNX
# plumbing needed for local speech detection.
transcribe-rs = { version = "0.3.11", features = ["onnx", "vad-silero"] }
image       = { version = "0.25", default-features = false, features = ["png"] }
libc        = "0.2"     # POSIX host/system calls

[target.'cfg(windows)'.dependencies]
notify-rust = "4.18.0"
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Media_Control",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_Security_Credentials",
  "Win32_Networking_NetworkListManager",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  ] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey      = "0.8"    # Carbon RegisterEventHotKey global hotkey (no Input Monitoring / Accessibility needed)
core-graphics      = "0.24"   # CGEvent post (Cmd+V), Caps-Lock state
core-foundation    = "0.10"   # CFRunLoop, CFString, CFRunLoopSource
objc2              = "0.5"     # msg_send! for AppKit (NSWorkspace, NSPasteboard)
objc2-foundation   = { version = "0.2", features = ["NSData", "NSString"] }  # NSData/NSString conversions
block2             = "0.5"     # ObjC completion blocks (AVCaptureDevice mic request)
accessibility-sys  = "0.1"     # AXUIElement (auto-learn focused text + AX prompt)
libproc            = "0.14"    # process RSS for memory monitor
security-framework = "2"       # macOS Keychain generic-password storage
coreaudio          = { package = "coreaudio-rs", version = "0.11" }  # CoreAudio native mute control

[profile.release]
opt-level  = "s"
lto        = true
strip      = true
panic      = "abort"
codegen-units = 1

[patch.crates-io]
# tauri-winrt-notification 0.7.2 pins quick-xml = "^0.37" (0.37.5 in our
# lockfile), which carries two high-severity DoS advisories with no fix in
# the 0.37 line (RUSTSEC-2026-0194, RUSTSEC-2026-0195; fixed upstream in
# 0.41.0). No notify-rust/tauri-winrt-notification release accepts a newer
# quick-xml yet, so pin the patched release directly via git instead of
# waiting. Pinned to the v0.41.0 tag's commit, not the tag name — a tag ref
# is a mutable pointer git will happily follow if it's ever force-moved,
# defeating the point of pinning a security fix.
quick-xml = { git = "https://github.com/tafia/quick-xml", rev = "4deda08abeffdc188c269360229cf47e12a77a9f" }
