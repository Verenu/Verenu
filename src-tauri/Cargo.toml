[package]
name = "verenu"
version = "0.21.0-nightly.20261028"
description = "Verenu — local-first AI dictation"
authors = ["Verenu Team"]
edition = "2021"

[[bin]]
name = "verenu"
path = "src/main.rs"

[lib]
name = "verenu"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
dev-session = []
native-testing = ["dev-session", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
android-local-testing = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
url = "2"

[dependencies]
axum = { version = "0.8" }
fs2 = "0.4"
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
tauri = { version = "2", features = ["tray-icon", "image-ico", "macos-private-api"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell       = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
scraper     = "0.24"
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "charset"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
mdns-sd          = "0.21"
if-addrs         = "0.15"
rustls           = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen            = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
spake2           = "0.4"
hkdf             = "0.12"
chacha20poly1305 = "0.10"
rand             = "0.8"
uuid             = { version = "1", features = ["v4"] }
bytes       = "1"
cpal        = "0.15"
rodio       = { version = "0.20", default-features = false }
hound       = "3.5"
nnnoiseless = "0.4"
base64      = "0.22"
anyhow      = "1"
unicode-segmentation = "1.12"
log         = "0.4"
chrono      = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
crossbeam-queue = "0.3"
flate2      = "1"
sha2        = "0.10"
tar         = "0.4"
zip         = { version = "9", default-features = false, features = ["deflate"] }
transcribe-rs = { version = "0.3.11", features = ["onnx", "vad-silero"] }
image       = { version = "0.25", default-features = false, features = ["png"] }
libc        = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
transcribe-rs = { version = "0.3.11", features = ["whisper-cpp"] }
whisper-rs = { version = "=0.16.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# CPAL's Android backend (Oboe) reads the process-wide JNI context through
# ndk-context. Tauri/tao owns the same activity context, so initialize this
# small bridge during Android setup before any audio worker can start.
ndk-context = "0.1"
jni = "0.21"

[target.'cfg(windows)'.dependencies]
notify-rust = "4.18.0"
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Media_Control",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_Security_Credentials",
  "Win32_Networking_NetworkListManager",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  ] }
# Required so #[implement] expansions can resolve `::windows_core`.
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey      = "0.8"
core-graphics      = "0.24"
core-foundation    = "0.10"
objc2              = "0.5"
objc2-foundation   = { version = "0.2", features = ["NSData", "NSString"] }
block2             = "0.5"
accessibility-sys  = "0.1"
libproc            = "0.14"
security-framework = "2"
coreaudio          = { package = "coreaudio-rs", version = "0.11" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
notify-rust = "4.18.0"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
secret-service = { version = "5.2", default-features = false, features = ["rt-tokio-crypto-rust"] }
wl-clipboard-rs = "0.9"
zbus = "5.19"
# Matches the version tao/wry already resolve (see Cargo.lock) so the
# gtk::ApplicationWindow returned by WebviewWindow::gtk_window() and the
# gtk::Settings used to theme it are the same type, not a version mismatch.
gtk = "0.18"
webkit2gtk = "2.0.2"

[dev-dependencies]
url = "2"

[profile.release]
opt-level  = "s"
lto        = true
strip      = true
panic      = "abort"
codegen-units = 1

[patch.crates-io]
# Tauri 2.11's Linux resize hook assumes WebView -> GtkBox -> GtkWindow and
# aborts when a legitimate GtkOverlay adds another ancestor. This upstream
# revision replaces the infallible downcast with a guarded lookup. Keep the
# runtime crates on one source revision so their shared trait types agree.
# The local Wry runtime adds atomic ownership of the main-thread context;
# see vendor/README.md and the runtime-handle-stress regression example.
tauri-runtime = { git = "https://github.com/tauri-apps/tauri.git", rev = "5a882eccfda53a189ec076c79c4ad186f50db5ff" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry-2.11.4" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri.git", rev = "5a882eccfda53a189ec076c79c4ad186f50db5ff" }
