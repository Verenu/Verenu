[package]
name = "open-flow"
version = "0.12.0"
description = "Open Flow — local-first AI dictation"
authors = ["Open Flow Team"]
edition = "2021"

[[bin]]
name = "open-flow"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "macos-private-api"] }
tauri-plugin-store       = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell       = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "multipart", "stream"] }
bytes       = "1"
cpal        = "0.15"
hound       = "3.5"
nnnoiseless = "0.4"
base64      = "0.22"
anyhow      = "1"
log         = "0.4"
chrono      = { version = "0.4", features = ["serde"] }
crossbeam-queue = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_Storage_FileSystem",
  "Win32_Security_Credentials",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics      = "0.24"   # CGEventTap, CGEvent post (Cmd+V)
foreign-types-shared = "0.3"
core-foundation    = "0.10"   # CFRunLoop, CFString, CFRunLoopSource
core-foundation-sys = "0.8"   # CFGetTypeID / CFRelease for AX value handling
objc2              = "0.5"     # msg_send! for AppKit (NSWorkspace, NSPasteboard)
objc2-foundation   = { version = "0.2", features = ["NSData", "NSString"] }  # NSData/NSString conversions
accessibility-sys  = "0.1"     # AXUIElement (auto-learn focused text + AX prompt)
libproc            = "0.14"    # process RSS for memory monitor
libc               = "0.2"     # statvfs (free disk space)
security-framework = "2"       # macOS Keychain generic-password storage
coreaudio          = { package = "coreaudio-rs", version = "0.11" }  # CoreAudio native mute control

[profile.release]
opt-level  = "s"
lto        = true
strip      = true
panic      = "abort"
codegen-units = 1
