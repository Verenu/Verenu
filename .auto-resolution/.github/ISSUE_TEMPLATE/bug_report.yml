name: Bug report
description: Report a reproducible Verenu bug
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, private dictated text, private screenshots, email addresses, full local paths, or logs with secrets.
  - type: input
    id: version
    attributes:
      label: Verenu version
      description: Use the version shown in the app, installer, or package.
      placeholder: "0.15.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: Use provider/model names only. Do not include API keys.
      placeholder: "Groq whisper-large-v3-turbo, OpenAI gpt-4o-mini"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fake sample text if dictation content matters.
      placeholder: |
        1. Open Verenu
        2. Hold the hotkey in a text editor
        3. Say "fake sample text"
        4. Release the hotkey
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks tried
      description: Include commands or manual checks, if any.
      placeholder: |
        npm test
        npm run check
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include API keys, private dictated text, private screenshots, email addresses, full local paths, or logs with secrets.
          required: true
