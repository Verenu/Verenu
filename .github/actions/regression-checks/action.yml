name: Deterministic regression checks
description: Run fast contracts and every isolated Rust-backed browser suite on Linux
inputs:
  report-prefix:
    description: Report and artifact name prefix
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: src-tauri
    - name: Install Linux build and fixture tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
          libxdo-dev libssl-dev libayatana-appindicator3-dev libasound2-dev \
          espeak-ng ffmpeg xvfb dbus-x11 gnome-keyring lua5.4
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Install browser
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Run deterministic contracts
      shell: bash
      env:
        REPORT_PREFIX: ${{ inputs.report-prefix }}
      run: |
        mkdir -p tests/reports
        npm test -- --strict --json-report "tests/reports/$REPORT_PREFIX-fast.json" --junit-report "tests/reports/$REPORT_PREFIX-fast.xml"
    - name: Lint Linux Rust including dev-session code
      shell: bash
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --features dev-session -- -D warnings
    - name: Verify generated compositor gestures
      shell: bash
      run: |
        cargo test --manifest-path src-tauri/Cargo.toml core::hyprland::tests --lib -- --include-ignored
        cargo test --manifest-path src-tauri/Cargo.toml core::hotkey::linux --lib
    - name: Run every owned-session and browser regression
      shell: bash
      env:
        REPORT_PREFIX: ${{ inputs.report-prefix }}
      run: |
        test_home="$(mktemp -d "${RUNNER_TEMP}/verenu-session-home.XXXXXX")"
        runtime_dir="$(mktemp -d "${RUNNER_TEMP}/verenu-xdg-runtime.XXXXXX")"
        chmod 700 "$test_home" "$runtime_dir"
        trap 'find "$test_home" "$runtime_dir" -depth -delete' EXIT
        runner_home="$HOME"
        cargo_home="${CARGO_HOME:-$runner_home/.cargo}"
        rustup_home="${RUSTUP_HOME:-$runner_home/.rustup}"
        browser_path="${PLAYWRIGHT_BROWSERS_PATH:-$runner_home/.cache/ms-playwright}"
        dbus-run-session -- env \
          HOME="$test_home" \
          XDG_RUNTIME_DIR="$runtime_dir" \
          CARGO_HOME="$cargo_home" \
          RUSTUP_HOME="$rustup_home" \
          PLAYWRIGHT_BROWSERS_PATH="$browser_path" \
          xvfb-run -a bash -euo pipefail -c '
            passphrase="$(openssl rand -hex 32)"
            if ! printf "%s\n" "$passphrase" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>"$HOME/gnome-keyring-start.log"; then
              cat "$HOME/gnome-keyring-start.log"
              exit 1
            fi
            unset passphrase
            npm run test:session:owned -- --report "tests/reports/$REPORT_PREFIX-session.json"
          '
    - name: Upload safe regression reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-prefix }}-reports
        path: tests/reports/
        if-no-files-found: error
