name: Build Installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} Installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os-name: windows
          - platform: macos-latest
            os-name: macos

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up macOS targets
        if: matrix.os-name == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri release app
        run: |
          if [ "${{ matrix.os-name }}" = "macos" ]; then
            npm run tauri build -- --target universal-apple-darwin
          else
            npm run tauri build
          fi
        shell: bash

      - name: Upload Windows setup installer (.exe)
        if: matrix.os-name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Open-Flow-Windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI installer (.msi)
        if: matrix.os-name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Open-Flow-Windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload macOS DMG installer (.dmg)
        if: matrix.os-name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Open-Flow-macOS-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macOS App bundle (.app)
        if: matrix.os-name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Open-Flow-macOS-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
