name: Extended Test Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

jobs:
  live-profile:
    name: Live profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build and synthetic audio prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev libasound2-dev \
            espeak-ng ffmpeg

      - name: Generate public synthetic speech
        run: npm run dev:fixtures -- --out test-results/audio

      - name: Detect live API secrets
        id: live-secrets
        shell: bash
        run: |
          if [ -n "${GROQ_API_KEY}${OPENAI_API_KEY}${GOOGLE_API_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip live profile when secrets are absent
        if: steps.live-secrets.outputs.enabled != 'true'
        run: |
          mkdir -p tests/reports
          node -e 'require("node:fs").writeFileSync("tests/reports/live-availability.json", JSON.stringify({status:"incomplete",reason:"No provider credentials are configured",providerExecution:"not-tested"},null,2))'
          echo '### Live verification incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo 'No provider credentials are configured. No live behavior was tested.' >> "$GITHUB_STEP_SUMMARY"
          exit 2

      - name: Run live profile
        if: steps.live-secrets.outputs.enabled == 'true'
        env:
          VERENU_LIVE_AUDIO_WAV: ${{ github.workspace }}/test-results/audio/plain.wav
        run: npm run test:live -- --strict --json-report tests/reports/live-profile.json --junit-report tests/reports/live-profile.xml

      - name: Upload live regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-regression-results
          path: tests/reports/
          if-no-files-found: error

  native-profile:
    name: Native WebView (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev libasound2-dev xvfb dbus-x11

      - name: Run native profile
        if: runner.os != 'Linux'
        run: npm run test:native:webview -- --report tests/reports/native-profile.json

      - name: Run Linux native WebView
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run test:native:webview -- --report tests/reports/native-profile.json

      - name: Upload native regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-regression-results-${{ matrix.os }}
          path: tests/reports/
          if-no-files-found: error
