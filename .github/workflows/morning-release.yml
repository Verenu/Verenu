name: Morning Dev Release

on:
  schedule:
    # GitHub schedules run on the default branch. Keep this workflow on master,
    # then explicitly inspect dev below. The timezone keeps 08:00 local time
    # across daylight-saving changes.
    - cron: '0 8 * * *'
      timezone: America/Vancouver
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: morning-dev-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish changed dev snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev history
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - name: Find changes since the previous dev release
        id: changes
        shell: bash
        env:
          NIGHTLY_START_VERSION: '0.16.0'
        run: |
          set -euo pipefail

          git fetch origin dev --tags --force
          dev_sha="$(git rev-parse origin/dev)"
          baseline_sha=""
          baseline_tag=""
          last_nightly=""

          # A nightly tag points at a temporary version-bump commit whose
          # parent is the dev snapshot it released. Find the newest such tag
          # whose parent is still reachable from the current dev branch.
          while IFS= read -r candidate; do
            if [[ ! "$candidate" =~ ^Verenu-[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}$ ]]; then
              continue
            fi
            nightly_commit="$(git rev-parse "${candidate}^{commit}")"
            candidate_sha="$(git rev-parse "${nightly_commit}^")"
            if git merge-base --is-ancestor "$candidate_sha" "$dev_sha"; then
              last_nightly="$candidate"
              baseline_sha="$candidate_sha"
              baseline_tag="$candidate"
              break
            fi
          done < <(git tag --list 'Verenu-*-nightly.*' | sort -Vr)

          # Before the first nightly, use the newest release tag reachable
          # from dev. Tags are branch-agnostic, so reachability is the branch
          # association we can verify safely.
          if [[ -z "$baseline_sha" ]]; then
            baseline_tag="$(git tag --merged "$dev_sha" --list 'Verenu-*' | sort -V | tail -n 1 || true)"
            if [[ -z "$baseline_tag" ]]; then
              echo 'No release tag reachable from dev; refusing to guess a baseline.' >&2
              exit 1
            fi
            baseline_sha="$(git rev-parse "${baseline_tag}^{commit}")"
          fi

          changed_lines="$(git diff --numstat "$baseline_sha..$dev_sha" -- . ':(exclude)package-lock.json' | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')"
          changed_lines="${changed_lines:-0}"

          echo "Baseline: $baseline_tag ($baseline_sha)"
          echo "Dev:      $dev_sha"
          echo "Changed lines: $changed_lines"
          git diff --stat "$baseline_sha..$dev_sha" -- . ':(exclude)package-lock.json'

          if (( changed_lines <= 10 )); then
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_date="$(TZ=America/Vancouver date +%Y%m%d)"
          if [[ -n "$last_nightly" ]]; then
            last_version="${last_nightly#Verenu-}"
            last_core="${last_version%%-nightly.*}"
            IFS=. read -r major minor patch <<< "$last_core"
            next_core="$major.$minor.$((patch + 1))"
          else
            next_core="$NIGHTLY_START_VERSION"
          fi

          release_version="${next_core}-nightly.${release_date}"
          release_tag="Verenu-${release_version}"
          if git show-ref --tags --verify --quiet "refs/tags/$release_tag"; then
            echo "Release tag $release_tag already exists; refusing to overwrite it." >&2
            exit 1
          fi

          git log --no-merges -n 100 --format='- %h %s' "$baseline_sha..$dev_sha" > commit-summary.md
          git diff --stat "$baseline_sha..$dev_sha" -- . ':(exclude)package-lock.json' > diff-stat.md
          git diff --unified=0 "$baseline_sha..$dev_sha" -- . ':(exclude)package-lock.json' > full-diff.patch
          head -c 60000 full-diff.patch > diff-preview.patch
          rm full-diff.patch

          {
            echo "Release version: $release_version"
            echo "Source branch: dev"
            echo "Source commit: $dev_sha"
            echo "Baseline tag: $baseline_tag"
            echo "Changed lines: $changed_lines"
            echo
            echo 'Commit summary:'
            cat commit-summary.md
            echo
            echo 'Diff stat:'
            cat diff-stat.md
            echo
            echo 'Bounded diff preview:'
            cat diff-preview.patch
          } > release-context.md

          {
            echo "should_release=true"
            echo "dev_sha=$dev_sha"
            echo "baseline_tag=$baseline_tag"
            echo "baseline_sha=$baseline_sha"
            echo "changed_lines=$changed_lines"
            echo "release_version=$release_version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Write AI release notes
        id: release-notes
        if: steps.changes.outputs.should_release == 'true'
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          prompt-file: release-context.md
          max-completion-tokens: 1600
          temperature: 0.2
          system-prompt: >-
            You write honest Verenu nightly release notes from the supplied
            git context. Return only markdown, never a code fence. Follow the
            repository's release-note style: title, one-sentence app blurb,
            What's New, Features, Getting Started, Shortcuts, Lightweight &
            Local, and Virustotal Review. Keep evergreen sections concise.
            Describe only changes supported by the context. Do not invent
            installers, VirusTotal URLs, tests, features, fixes, people,
            secrets, or private information. For this source-only nightly,
            state plainly in Virustotal Review that no installer artifacts are
            attached.

      - name: Save generated release notes
        if: steps.changes.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.release-notes.outputs.response-file }}" release-notes.md
          test -s release-notes.md

      - name: Create the versioned nightly tag
        id: tag
        if: steps.changes.outputs.should_release == 'true'
        shell: bash
        env:
          DEV_SHA: ${{ steps.changes.outputs.dev_sha }}
          RELEASE_VERSION: ${{ steps.changes.outputs.release_version }}
          RELEASE_TAG: ${{ steps.changes.outputs.release_tag }}
        run: |
          set -euo pipefail

          # The commit is intentionally not pushed to dev or master. The tag
          # contains the release-only version while its parent remains the
          # exact dev snapshot that was inspected above.
          git checkout --detach "$DEV_SHA"
          node - "$RELEASE_VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const replacements = [
            ['package.json', /(\"version\"\s*:\s*\")[^\"]+(\")/, `$1${version}$2`],
            ['src-tauri/tauri.conf.json', /(\"version\"\s*:\s*\")[^\"]+(\")/, `$1${version}$2`],
            ['src-tauri/Cargo.toml', [/^version\s*=\s*\"[^\"]+\"/m, `version = \"${version}\"`]],
          ];

          for (const [file, pattern, replacement] of replacements) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replace(pattern, replacement);
            if (after === before) throw new Error(`Could not update version in ${file}`);
            fs.writeFileSync(file, after);
          }
          NODE

          git diff --check
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(release): $RELEASE_TAG [skip ci]"

          release_sha="$(git rev-parse HEAD)"
          git tag -a "$RELEASE_TAG" "$release_sha" -m "Verenu $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        if: steps.changes.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.changes.outputs.release_tag }}
          target_commitish: ${{ steps.tag.outputs.release_sha }}
          name: Verenu ${{ steps.changes.outputs.release_version }}
          body_path: release-notes.md
          prerelease: true
          make_latest: false
