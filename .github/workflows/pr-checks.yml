name: PR Checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Svelte
        run: npm run check

      - name: Build frontend
        run: npm run build

  dependency-audits:
    name: Dependency audits
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        # Production dependencies are audited. Dev-only transitive tooling
        # (e.g. nanoid pinned by the Vite toolchain) is skipped: the webview
        # bundle is prebuilt at release time and never ships those packages.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit
          fallback: none

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Verify Tauri plugin version alignment
        # The Tauri CLI aborts the build when the Rust crate and NPM package
        # of any plugin disagree on major/minor. Cargo resolves semver ranges
        # to the newest compatible crate while npm follows package-lock.json,
        # so the two sides can drift apart silently (this broke the
        # 2026-09-21 nightly: tauri-plugin-notification 2.4.0 vs
        # @tauri-apps/plugin-notification 2.3.3). Fail fast here instead of
        # in the middle of a release build.
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');

          const npmVersions = {};
          for (const [path, entry] of Object.entries(lock.packages || {})) {
            const m = path.match(/^node_modules\/(@tauri-apps\/plugin-[^/]+)$/);
            if (m && entry.version) npmVersions[m[1].replace('@tauri-apps/plugin-', '')] = entry.version;
          }

          const cargoVersions = {};
          for (const block of cargoLock.split('[[package]]')) {
            const name = block.match(/^name = "([^"]+)"/m)?.[1];
            const version = block.match(/^version = "([^"]+)"/m)?.[1];
            if (name && version && name.startsWith('tauri-plugin-')) {
              cargoVersions[name.replace('tauri-plugin-', '')] = version;
            }
          }

          const majorMinor = (v) => v.split('.').slice(0, 2).join('.');
          let failed = false;
          for (const [plugin, npmVersion] of Object.entries(npmVersions)) {
            const cargoVersion = cargoVersions[plugin];
            if (!cargoVersion) {
              console.log(`SKIP ${plugin}: npm ${npmVersion}, no matching Rust crate in Cargo.lock`);
              continue;
            }
            if (majorMinor(npmVersion) !== majorMinor(cargoVersion)) {
              console.error(`MISMATCH tauri-plugin-${plugin}: Rust crate ${cargoVersion} vs NPM package ${npmVersion} (major/minor must match)`);
              failed = true;
            } else {
              console.log(`OK tauri-plugin-${plugin}: Rust ${cargoVersion} / NPM ${npmVersion}`);
            }
          }
          if (failed) process.exit(1);
          NODE

  rust:
    name: Rust checks
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64). GitHub retired the macos-13
        # (Intel) runner image — a job pinned to it just queues forever and
        # gets auto-cancelled after 24h, never running — so there's currently
        # no GitHub-hosted way to test real Intel Mac silicon; the release
        # pipeline's "Intel" DMG remains cross-compiled on arm64, untested.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Rust toolchain
        run: rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check browser dev-session bridge
        run: cargo test --manifest-path src-tauri/Cargo.toml --features dev-session dev_session_ --lib

  blob-size-guard:
    name: No large files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail if any changed file exceeds 10 MB
        # Guardrail: build trees and other agent-workspace artifacts must never
        # land in git history again (target-test-codex/ alone added ~1.3 GB).
        # Installers under /installers are an intentional exception handled by
        # their own release process, but they stay under this limit per file.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PR_BASE_SHA"
          head="$PR_HEAD_SHA"
          oversized=$(git diff --name-only "$base" "$head" -z |
            while IFS= read -r -d '' file; do
              if git cat-file -e "$head:$file" 2>/dev/null; then
                size=$(git cat-file -s "$head:$file")
                if [ "$size" -gt 10485760 ]; then
                  echo "$file ($(( size / 1048576 )) MB)"
                fi
              fi
            done)
          if [ -n "$oversized" ]; then
            echo "Files exceeding the 10 MB limit:"
            echo "$oversized"
            exit 1
          fi
          echo "No changed file exceeds 10 MB."

  all-in-one-fast:
    name: All-in-one fast profile
    # This job uses its own checkout and consumes no output from other checks.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev \
            libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare report directory
        run: mkdir -p tests/reports

      - name: Run unified fast profile
        run: npm test -- --strict --json-report tests/reports/fast-profile.json --junit-report tests/reports/fast-profile.junit.xml

      - name: Install real-session fixture tools
        run: sudo apt-get install -y espeak-ng ffmpeg xvfb dbus-x11 lua5.4

      - name: Verify Linux window identity and generated compositor gestures
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml core::hyprland::tests --lib -- --include-ignored
          cargo test --manifest-path src-tauri/Cargo.toml core::hotkey::linux --lib

      - name: Exercise an isolated Rust-backed browser session
        run: dbus-run-session -- xvfb-run -a npm run test:session:owned -- --report tests/reports/real-session.json

      - name: Upload fast-profile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-profile-reports
          path: tests/reports/
