name: PR Checks

on:
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Svelte
        run: npm run check

      - name: Build frontend
        run: npm run build

  dependency-audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  rust:
    name: Rust checks
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64). GitHub retired the macos-13
        # (Intel) runner image — a job pinned to it just queues forever and
        # gets auto-cancelled after 24h, never running — so there's currently
        # no GitHub-hosted way to test real Intel Mac silicon; the release
        # pipeline's "Intel" DMG remains cross-compiled on arm64, untested.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Rust toolchain
        run: rustc --version

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  all-in-one-fast:
    name: All-in-one fast profile
    needs: [frontend, dependency-audits, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev \
            libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare report directory
        run: mkdir -p tests/reports

      - name: Run unified fast profile
        run: npm test -- --json-report tests/reports/fast-profile.json --junit-report tests/reports/fast-profile.junit.xml

      - name: Upload fast-profile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-profile-reports
          path: tests/reports/
