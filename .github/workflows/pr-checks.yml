name: PR Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI needs assertions and panic locations, but no debugger symbol bundles.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Svelte
        run: npm run check

      - name: Build frontend
        run: npm run build

  dependency-audits:
    name: Dependency audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
        with:
          tool: cargo-audit
          fallback: none

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Verify Tauri plugin version alignment
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');

          const npmVersions = {};
          for (const [path, entry] of Object.entries(lock.packages || {})) {
            const m = path.match(/^node_modules\/(@tauri-apps\/plugin-[^/]+)$/);
            if (m && entry.version) npmVersions[m[1].replace('@tauri-apps/plugin-', '')] = entry.version;
          }

          const cargoVersions = {};
          for (const block of cargoLock.split('[[package]]')) {
            const name = block.match(/^name = "([^"]+)"/m)?.[1];
            const version = block.match(/^version = "([^"]+)"/m)?.[1];
            if (name && version && name.startsWith('tauri-plugin-')) {
              cargoVersions[name.replace('tauri-plugin-', '')] = version;
            }
          }

          const majorMinor = (v) => v.split('.').slice(0, 2).join('.');
          let failed = false;
          for (const [plugin, npmVersion] of Object.entries(npmVersions)) {
            const cargoVersion = cargoVersions[plugin];
            if (!cargoVersion) {
              console.log(`SKIP ${plugin}: npm ${npmVersion}, no matching Rust crate in Cargo.lock`);
              continue;
            }
            if (majorMinor(npmVersion) !== majorMinor(cargoVersion)) {
              console.error(`MISMATCH tauri-plugin-${plugin}: Rust crate ${cargoVersion} vs NPM package ${npmVersion} (major/minor must match)`);
              failed = true;
            } else {
              console.log(`OK tauri-plugin-${plugin}: Rust ${cargoVersion} / NPM ${npmVersion}`);
            }
          }
          if (failed) process.exit(1);
          NODE

  rust-partitions:
    name: ${{ matrix.check == 'clippy' && 'Rust lint' || matrix.check == 'test' && 'Rust tests' || 'Rust dev-session bridge tests' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        check: [clippy, test, dev-session]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Rust toolchain
        run: rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          shared-key: pr-${{ matrix.check }}

      - name: Run clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        if: matrix.check == 'test'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check browser dev-session bridge
        if: matrix.check == 'dev-session'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features dev-session dev_session_ --lib

  rust:
    name: Rust checks
    if: always()
    needs: rust-partitions
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Rust partitions
        env:
          RESULT: ${{ needs.rust-partitions.result }}
        run: test "$RESULT" = success

  blob-size-guard:
    name: No large files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail if any changed file exceeds 10 MB
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PR_BASE_SHA"
          head="$PR_HEAD_SHA"
          oversized=$(git diff --name-only "$base" "$head" -z |
            while IFS= read -r -d '' file; do
              if git cat-file -e "$head:$file" 2>/dev/null; then
                size=$(git cat-file -s "$head:$file")
                if [ "$size" -gt 10485760 ]; then
                  echo "$file ($(( size / 1048576 )) MB)"
                fi
              fi
            done)
          if [ -n "$oversized" ]; then
            echo "Files exceeding the 10 MB limit:"
            echo "$oversized"
            exit 1
          fi
          echo "No changed file exceeds 10 MB."

  fast-partitions:
    name: Fast regression suites (${{ matrix.suites }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: preflight-contract, suites: 'preflight,contract' }
          - { label: unit-frontend, suites: 'unit,frontend' }
          - { label: rust, suites: 'rust' }
          - { label: ui, suites: 'ui' }
          - { label: accessibility-state, suites: 'accessibility,state' }
          - { label: performance, suites: 'performance' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run selected fast regression suites
        uses: ./.github/actions/regression-checks
        with:
          report-prefix: pr-fast-${{ matrix.label }}
          profile: fast
          fast-suites: ${{ matrix.suites }}

  linux-regressions:
    name: Linux native regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/regression-checks
        with:
          report-prefix: pr-linux
          profile: linux

  all-in-one-fast:
    name: All-in-one fast profile
    if: always()
    needs: [fast-partitions, linux-regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast partition
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); const failed=Object.entries(jobs).filter(([,job])=>job.result!=="success"); if(failed.length) { console.error(failed.map(([name,job])=>`${name}: ${job.result}`).join("\n")); process.exit(1); }'

  owned-sessions:
    name: ${{ matrix.suite == 'node' && 'Rust-backed Node integration tests' || format('Rust-backed {0} browser tests', matrix.project) }} (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: node-1, suite: node, shard: '1/6', project: all }
          - { label: node-2, suite: node, shard: '2/6', project: all }
          - { label: node-3, suite: node, shard: '3/6', project: all }
          - { label: node-4, suite: node, shard: '4/6', project: all }
          - { label: node-5, suite: node, shard: '5/6', project: all }
          - { label: node-6, suite: node, shard: '6/6', project: all }
          - { label: desktop-1, suite: browser, shard: '1/4', project: desktop }
          - { label: desktop-2, suite: browser, shard: '2/4', project: desktop }
          - { label: desktop-3, suite: browser, shard: '3/4', project: desktop }
          - { label: desktop-4, suite: browser, shard: '4/4', project: desktop }
          - { label: phone-1, suite: browser, shard: '1/4', project: phone }
          - { label: phone-2, suite: browser, shard: '2/4', project: phone }
          - { label: phone-3, suite: browser, shard: '3/4', project: phone }
          - { label: phone-4, suite: browser, shard: '4/4', project: phone }
    steps:
      - uses: actions/checkout@v6
      - name: Run selected isolated session tests
        uses: ./.github/actions/regression-checks
        with:
          report-prefix: pr-${{ matrix.label }}
          profile: owned
          suite: ${{ matrix.suite }}
          shard: ${{ matrix.shard }}
          project: ${{ matrix.project }}

  workflow-tests:
    name: Workflow and test infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test and lint CI workflows
        run: npm run test:ci
      - name: Test Playwright report validation
        run: node --test tests/verification/playwright-summary.test.mjs tests/verification/playwright-report.test.mjs

  android:
    name: Android Kotlin and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Run Android unit tests
        run: npm run test:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-reports
          path: src-tauri/gen/android/app/build/test-results/
          if-no-files-found: ignore

  native:
    name: Native WebView (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev libasound2-dev xvfb dbus-x11
      - run: npm ci
      - name: Test native WebView and IPC
        if: runner.os != 'Linux'
        run: npm run test:native:webview -- --report tests/reports/native.json
      - name: Test Linux native WebView and IPC
        if: runner.os == 'Linux'
        run: |
          runtime_dir="$(mktemp -d "${RUNNER_TEMP}/verenu-xdg-runtime.XXXXXX")"
          chmod 700 "$runtime_dir"
          XDG_RUNTIME_DIR="$runtime_dir" dbus-run-session -- xvfb-run -a npm run test:native:webview -- --report tests/reports/native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pr-reports-${{ matrix.os }}
          path: tests/reports/
          if-no-files-found: error

  required:
    name: CI required
    if: always()
    needs: [frontend, dependency-audits, rust, blob-size-guard, all-in-one-fast, owned-sessions, workflow-tests, android, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); const failed=Object.entries(jobs).filter(([,job])=>job.result!=="success"); if(failed.length) { console.error(failed.map(([name,job])=>`${name}: ${job.result}`).join("\n")); process.exit(1); }'
