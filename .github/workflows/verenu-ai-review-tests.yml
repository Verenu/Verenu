name: AI reviewer tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/verenu-ai-review*'
      - '.github/workflows/verenu-ai-review-tests.yml'

permissions:
  contents: read

jobs:
  reviewer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test quota detection and fallback
        run: node --test scripts/verenu-ai-review-*.test.mjs
